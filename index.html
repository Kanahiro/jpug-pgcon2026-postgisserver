<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PostGIS Server Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 10px; left: 10px; z-index: 1; background: #fff; padding: 8px;
           border-radius: 4px; box-shadow: 0 1px 4px #0004; max-width: min(420px, calc(100vw - 36px)); }
  #panel > div { margin-top: 4px; }
  #status { color: #555; }
  #status.err { color: #c00; }
  #wkt { max-height: 40vh; overflow: auto; font: 11px monospace; margin: 6px 0 0; background: #f6f6f6; padding: 4px; }
  .maplibregl-popup-content pre { margin: 0; font: 11px monospace; max-height: 30vh; overflow: auto; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <select id="table"></select>
  <label><input type="radio" name="fmt" value="mvt" checked> MVT</label>
  <label><input type="radio" name="fmt" value="geojson"> GeoJSON</label>
  <div>
    <label><input type="checkbox" id="tiles"> タイル境界</label>
    <button id="wktBtn">WKT表示</button>
  </div>
  <div id="status"></div>
  <pre id="wkt" hidden></pre>
</div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = () => document.querySelector('[name=fmt]:checked').value;
const status = (msg, err = false) => { $('status').textContent = msg; $('status').className = err ? 'err' : ''; };
const is = (...types) => ['in', ['geometry-type'], ['literal', types]];
const LAYERS = [
  { id: 'fill', type: 'fill', filter: is('Polygon', 'MultiPolygon'), paint: { 'fill-color': '#e33', 'fill-opacity': 0.25 } },
  { id: 'line', type: 'line', filter: ['!', is('Point', 'MultiPoint')], paint: { 'line-color': '#c00', 'line-width': 1.5 } },
  { id: 'circle', type: 'circle', filter: is('Point', 'MultiPoint'),
    paint: { 'circle-color': '#e33', 'circle-radius': 5, 'circle-stroke-color': '#fff', 'circle-stroke-width': 1 } },
];
let tables = [];

const map = new maplibregl.Map({
  container: 'map',
  center: [139.767, 35.681],
  zoom: 4,
  style: {
    version: 8,
    sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256,
                      attribution: '© OpenStreetMap contributors' } },
    layers: [{ id: 'osm', type: 'raster', source: 'osm' }],
  },
});
map.addControl(new maplibregl.NavigationControl());

function render() {
  const t = $('table').value;
  for (const l of LAYERS) if (map.getLayer(l.id)) map.removeLayer(l.id);
  if (map.getSource('data')) map.removeSource('data');
  $('wkt').hidden = true;
  if (!t) return;
  const mvt = fmt() === 'mvt';
  map.addSource('data', mvt
    ? { type: 'vector', tiles: [`${location.origin}/${t}/{z}/{x}/{y}.mvt`] }
    : { type: 'geojson', data: `${location.origin}/${t}.geojson` });
  for (const l of LAYERS) map.addLayer({ ...l, source: 'data', ...(mvt && { 'source-layer': t }) });
  const m = tables.find((x) => x.name === t);
  status(`${t}: ${m.type} / EPSG:${m.srid} / ${mvt ? 'MVT' : 'GeoJSON'}`);
}

map.on('load', async () => {
  try {
    tables = await (await fetch('/tables.json')).json();
  } catch (e) {
    return status(`/tables.json の取得に失敗: ${e.message}`, true);
  }
  if (!tables.length) return status('geometry_columns に public スキーマのテーブルがありません', true);
  $('table').innerHTML = tables.map((t) => `<option>${t.name}</option>`).join('');
  $('table').onchange = () => {
    render();
    const { bbox } = tables.find((x) => x.name === $('table').value);
    if (bbox) map.fitBounds(bbox, { padding: 40, maxZoom: 16 });
  };
  $('table').onchange();
});

document.querySelectorAll('[name=fmt]').forEach((el) => (el.onchange = render));
$('tiles').onchange = (e) => (map.showTileBoundaries = e.target.checked);

$('wktBtn').onclick = async () => {
  if (!$('wkt').hidden) return ($('wkt').hidden = true);
  const text = await (await fetch(`/${$('table').value}.wkt`)).text();
  // ponytail: 巨大テーブルでブラウザが固まらないよう先頭だけ表示
  $('wkt').textContent = text.length > 100000 ? text.slice(0, 100000) + '\n…(truncated)' : text;
  $('wkt').hidden = false;
};

map.on('error', (e) => e.sourceId !== 'osm' && status(e.error?.message ?? String(e), true));

map.on('click', (e) => {
  const f = map.queryRenderedFeatures(e.point, { layers: LAYERS.map((l) => l.id) })[0];
  if (!f) return;
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(f.properties, null, 2);
  new maplibregl.Popup().setLngLat(e.lngLat).setDOMContent(pre).addTo(map);
});
for (const l of LAYERS) {
  map.on('mouseenter', l.id, () => (map.getCanvas().style.cursor = 'pointer'));
  map.on('mouseleave', l.id, () => (map.getCanvas().style.cursor = ''));
}
</script>
</body>
</html>
